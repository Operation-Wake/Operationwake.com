[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/campaign-progress"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/campaign-progress"
  to = "/.netlify/functions/campaign-progress"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
